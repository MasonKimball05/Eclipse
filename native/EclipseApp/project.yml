# Eclipse for iPhone and iPad: your Spaces, their pinned tabs and folders, and Favorites, read from the Eclipse
# Sync folder your Macs write in iCloud Drive (EclipseKit). The Xcode project is made from this by XcodeGen:
#   ./run.sh --ios          (makes it, builds it and opens it in the Simulator)
#   cd native/EclipseApp && xcodegen    (just the project, to open in Xcode)
name: EclipseApp
options:
  bundleIdPrefix: com.masonkimball
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  EclipseKit:
    path: ../EclipseKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Eclipse:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: EclipseKit
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Eclipse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masonkimball.eclipse.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

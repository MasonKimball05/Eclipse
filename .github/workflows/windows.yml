# Eclipse on Windows, checked on a real Windows machine (GitHub's) after every push: it starts, opens its
# window, loads a page and keeps a secret in Windows Credential Manager (tools/smoke.py), and the unit tests
# pass (the ones that need a Mac's own tools are skipped there).
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"  # (as run.ps1 and main.py start it)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Eclipse's requirements
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Eclipse starts and loads a page
        run: python tools/smoke.py
      - name: Unit tests
        run: python -X faulthandler -m pytest tests -q -rs --ignore=tests/test_spelling.py
      # (on its own, with crash tracing: Qt's networking crashed here once, taking the whole run down with it)
      - name: Spell-check dictionary download
        if: always()
        run: python -X faulthandler -m pytest tests/test_spelling.py -v -rs
